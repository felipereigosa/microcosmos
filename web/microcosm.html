<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lacrymaria olor</title>
<style>
  html, body { margin: 0; height: 100%; background: #01060b; overflow: hidden; color: #cfe9ee;
    font: 14px/1.3 system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #fps { position: fixed; left: 18px; top: 14px; opacity: .6; font-variant-numeric: tabular-nums; }
  #speedBox { position: fixed; left: 18px; bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; align-items: center;
    gap: 8px; opacity: .8; }
  #speed { width: 150px; height: 28px; accent-color: #58b9c6; }
  #speedLabel { width: 4em; font-variant-numeric: tabular-nums; }
  #corner { position: fixed; right: 18px; bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 10px; }
  #corner button { height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(160, 220, 235, .3);
    background: rgba(10, 28, 38, .7); color: #cfe9ee; font: inherit; cursor: pointer; }
  #corner button:hover { background: rgba(30, 60, 75, .8); }
  #sound { width: 38px; padding: 0 !important; opacity: .8; }
  #sound svg { display: block; margin: auto; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7;
    stroke-linecap: round; stroke-linejoin: round; }
  #sound .mute { display: none; }
  #sound.off { opacity: .45; }
  #sound.off .waves { display: none; }
  #sound.off .mute { display: inline; }
  #panel { position: fixed; right: 18px; top: 18px; width: 340px; max-height: calc(100% - 36px); box-sizing: border-box;
    overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #ffffff22 transparent;
    padding: 22px 24px 18px; border-radius: 18px; --accent: #8fd3df;
    background: linear-gradient(160deg, rgba(10, 28, 38, .78), rgba(3, 10, 16, .82));
    -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3);
    border: 1px solid rgba(160, 220, 235, .16); box-shadow: 0 18px 50px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .06);
    transition: opacity .35s ease, transform .35s cubic-bezier(.2, .8, .2, 1); }
  #panel.off { opacity: 0; transform: translateX(18px); pointer-events: none; }
  #panel .kind { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
  #panel h2 { margin: 6px 28px 6px 0; font: italic 500 27px/1.15 Georgia, 'Times New Roman', serif; color: #f1fafb; }
  #panel .tag { margin: 0; font-size: 14.5px; line-height: 1.4; opacity: .85; }
  #panel .stats { display: grid; grid-template-columns: repeat(3, 1fr); margin: 16px 0 14px; padding: 12px 0;
    border-top: 1px solid rgba(160, 220, 235, .14); border-bottom: 1px solid rgba(160, 220, 235, .14); }
  #panel .stats div { padding: 0 10px; border-left: 1px solid rgba(160, 220, 235, .14); }
  #panel .stats div:first-child { padding-left: 0; border-left: 0; }
  #panel .stats b { display: block; font-size: 18px; font-weight: 600; color: var(--accent); white-space: nowrap; }
  #panel .stats span { display: block; margin-top: 2px; font-size: 11px; line-height: 1.25; opacity: .6; }
  #panel p.body { margin: 0 0 10px; font-size: 13.5px; line-height: 1.5; opacity: .88; }
  #panel h3 { margin: 16px 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; opacity: .55; }
  #panel ul { list-style: none; margin: 0; padding: 0; }
  #panel li { position: relative; margin: 0 0 7px; padding-left: 18px; font-size: 13px; line-height: 1.4; opacity: .9; }
  #panel li i { position: absolute; left: 0; top: .42em; width: 8px; height: 8px; border-radius: 50%; background: var(--c);
    box-shadow: 0 0 8px var(--c); }
  #panel li b { font-weight: 600; color: #f1fafb; }
  #panel .model { margin: 16px 0 0; padding-top: 12px; border-top: 1px solid rgba(160, 220, 235, .14); font-size: 11px;
    line-height: 1.45; opacity: .5; }
  #panelClose { position: absolute; right: 12px; top: 12px; width: 32px; height: 32px; border: 0; border-radius: 50%;
    background: rgba(255, 255, 255, .06); color: #cfe9ee; font-size: 18px; line-height: 1; cursor: pointer; }
  #panelClose:hover { background: rgba(255, 255, 255, .14); }
  @media (max-width: 640px) {
    #panel { left: 10px; right: 10px; top: auto; bottom: calc(10px + env(safe-area-inset-bottom)); width: auto; max-height: 46%;
      padding: 18px 18px 14px; }
    #panel.off { transform: translateY(18px); }
    #panel h2 { font-size: 23px; }
    body.info #speedBox, body.info #corner { display: none; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="fps" hidden></div>
<label id="speedBox">Speed <input id="speed" type="range" min="0" max="2" step="any" aria-label="Simulation speed; all the way left pauses"><span id="speedLabel"></span></label>
<div id="corner"><button id="sound" hidden aria-label="Music" title="Music: &quot;Dreams Become Real&quot; by Kevin MacLeod (incompetech.com), CC BY 4.0"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="waves" d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/><path class="mute" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button><button id="vr" hidden>Enter VR</button></div>
<aside id="panel" class="off" aria-live="polite"><button id="panelClose" aria-label="Close">×</button><div id="panelBody"></div></aside>

nd of microtubules; the folded surface unspools into the neck like curved origami and folds away again when it comes back."],look:[[yl,"Cilia","in rows along the pleats, with a ring of longer ones round the head that pulls the neck out","cilia"],[xd,"Extrusomes","rods in the head, fired into prey on contact","extrusomes"],[Zo,"Two macronuclei","with the small micronucleus between them","nuclei"],[$o,"Contractile vacuoles","fill with water and empty at a stroke","vacuoles"],[xl,"Food vacuoles","earlier meals, being digested; the big red one is the Halteria it has just swallowed","food"],[vd,"Mitochondria","under the surface, with a basal body at the foot of every cilium","mito"]],model:"Shape measured from footage by James Weiss (Journey to the Microcosmos); structure after Flaum & Prakash, Science 2024. Behaviour is modelled, not observed, except the meal, which follows a hunt in that footage at about twice its pace; the organelles are coloured as in a textbook: in life they are colourless."},desmodesmus:{accent:"#a5dc6e",kind:"Green alga \xB7 colony",name:"Desmodesmus communis",tag:"A raft of sister cells joined side by side, with a spine at each corner.",stats:[["","cells in this colony"],["8\u201323 \xB5m","length of a cell"],["4","spines, on the end cells"]],text:["It has no cilia or flagella and does not swim: it drifts and tumbles wherever the water takes it, living on light. Colonies come in rows of two, four or eight cells, all daughters of one mother cell, and are among the commonest algae of ponds and lakes.","Each cell sits in a tough wall of several layers, the outermost a fine net held off the rest by tiny struts. The long spines are thought to slow its sinking and make it an awkward mouthful."],look:[["#3fae2a","Chloroplast","one per cell, lining the wall like a cup, striped with thylakoids","chloroplast"],["#ccf26b","Pyrenoid","where carbon dioxide is fixed, sheathed in starch plates","pyrenoid"],[Zo,"Nucleus","one in each cell","nucleus"],[yl,"Wall","its net and rosettes show up close","wall"],[A4,"Oil and starch","the stores, as scattered grains","stores"]],model:"Measurements after Hegewald & Braband, Fottea 2017. The net of the wall is drawn coarser than life so that it can be seen; the inside is generic green alga cell biology."},vorticella:{accent:"#7fa2ff",kind:"Ciliate \xB7 filter feeder",name:"Vorticella",tag:"A bell on a spring, fishing from where it stands.",stats:[["few ms","to coil its stalk"],["seconds","to stretch out again"],["1\xBC turns","of cilia round the rim"]],text:["It lives fixed by a stalk to debris or plants. The wreath of cilia round the rim of the bell beats in waves and sets up a ring-shaped eddy in the water in front of it, which carries bacteria in to the funnel of the mouth.","At a disturbance the band inside the stalk contracts and the stalk snaps into a coil, among the fastest movements of any living thing for its size, while the bell closes. Then it slowly uncoils and opens again. Drawn small here; in life the bell is 50 to 90 \xB5m long."],look:[[$o,"Stalk","a clear sheath with the contractile band, the spasmoneme, winding inside","stalk"],[yl,"Wreath of cilia","round the rim only; the body of the bell is bare, ringed with fine lines","wreath"],["#e0d68c","Funnel","the mouth, leading from the edge of the disc down into the bell","funnel"],[Zo,"Macronucleus","a long band bent into a C, with the small micronucleus beside it","nucleus"],[$o,"Contractile vacuole","beside the funnel, pumping water out","vacuole"],[xl,"Food vacuoles","and mitochondria","food"]],model:"Proportions as usually given for Vorticella convallaria (review: Ryu and others, Micromachines 2017). The specks in the eddy are there to show the current; they are not eaten."},paramecium:{accent:"#c3cdf5",kind:"Ciliate \xB7 grazer",name:"Paramecium caudatum",tag:"The slipper animalcule, rowing itself along with thousands of cilia.",stats:[["10\u201320","beats a second, each cilium"],["1 mm/s","at full speed"],["1 turn/s","rolling as it swims"]],text:["Its cilia beat in waves that run over the body like wind over wheat, driving it forward on a spiral. At a clump of debris it noses in and swings about, while the cilia of the groove along its side sweep bacteria down to the mouth.","When it bumps into something it backs up for a moment, the cilia striking forward, pivots about its back end and sets off another way. The two here are drawn small; in life this species is 170 to 300 \xB5m long."],look:[[yl,"Cilia","on a lattice in the pellicle, with trichocysts between them; drawn short here, in life about 10 \xB5m long","cilia"],[Zo,"Macronucleus","the big bean, with the micronucleus pressed against it","nucleus"],[$o,"Contractile vacuoles","two stars of canals that pump water out in turn","vacuoles"],["#e0d68c","Gullet","the funnel at the end of the groove where food vacuoles form","gullet"],[xl,"Food vacuoles","carried round the cell, browning as they are digested","food"],[vd,"Mitochondria","and a few Golgi stacks deeper in","mito"]],model:"After Brette, eNeuro 2021, and videos by Alexander Klepnev (Wikimedia Commons, CC BY 4.0). Behaviour is modelled, not observed; the food vacuoles travel far faster than in life."},halteria:{accent:"#ff9a85",kind:"Ciliate \xB7 jumper",name:"Halteria",tag:"A small globe that hangs in the water, and is suddenly somewhere else.",stats:[["15\u201335 \xB5m","across"],["7\u201310","rows of jumping bristles"],["15 + 7","membranelles, round the front and in the mouth"]],text:["It hovers almost still, turning slowly, while a collar of membranelles, plates of fused cilia, fans bacteria and small algae into its mouth. It is one of the commonest grazers of bacteria in ponds and lakes.","Round its middle stand long stiff bristles. At a touch, or a sudden current, they all strike at once and the cell shoots off backwards, many times faster than it swims: often enough to slip a hunter. Not always. One of the five here is caught by the Lacrymaria each time round, and another drifts in to take its place."],look:[["#ff8a70","Bristles","in groups round the equator: still at rest, swung back together in a jump","bristles"],["#ffb09a","Collar of membranelles","beating in a wave round the front, with a smaller row leading into the mouth","collar"],[Zo,"Macronucleus","oblong, with the round micronucleus beside it","nucleus"],[$o,"Contractile vacuole","half way along, beside the mouth","vacuole"],[xl,"Food vacuoles","and, close up, small round mitochondria under the surface","food"],[xd,"Stings","on the one that is caught: the threads the Lacrymaria has driven into it","stings"]],model:"Proportions as usually given for Halteria grandinella; the catch after footage by James Weiss (Journey to the Microcosmos). Coloured red to tell it apart: in life it is colourless. The length and speed of the jump are estimates."},oscillatoria:{accent:"#6fd08a",kind:"Cyanobacterium \xB7 filament",name:"Oscillatoria",tag:"A long green thread of disc-shaped cells, stacked like a roll of coins.",stats:[["0","nuclei: it is a bacterium"],["1 row","of cells, end to end"],["2.4 bn yr","since its kin first filled the air with oxygen"]],text:["It looks like a plant but is a bacterium: each thin disc is one cell, with no nucleus and no chloroplast. The pigments that catch the light are spread through the whole cell, which is why the thread is evenly green.","It grows by its cells dividing across the thread, and multiplies when a piece breaks off and glides away. In life the threads creep slowly and sway their tips from side to side, the oscillation they are named for; the ones here lie still."],look:[["#3fae2a","Cross-walls","the fine dark lines every few micrometres, one between each pair of cells","walls"],["#8fe0a0","Sheath and wall","the brighter outline of the tube","sheath"],["#2f8f3a","Grainy inside","pigment membranes and stores, with no organelles to pick out","inside"]],model:"Shape after the Oscillatoria in footage by James Weiss (Journey to the
