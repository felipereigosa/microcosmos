<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lacrymaria olor</title>
<style>
  html, body { margin: 0; height: 100%; background: #01060b; overflow: hidden; color: #cfe9ee;
    font: 14px/1.3 system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #title { position: fixed; left: 18px; top: 14px; pointer-events: none; text-shadow: 0 0 8px #000; }
  #title b { font-size: 20px; font-style: italic; font-weight: 600; }
  #title span { display: block; opacity: .7; margin-top: 2px; }
  #fps { position: fixed; right: 14px; top: 14px; opacity: .6; font-variant-numeric: tabular-nums; }
  #speedBox { position: fixed; left: 18px; bottom: calc(30px + env(safe-area-inset-bottom)); display: flex; align-items: center;
    gap: 8px; opacity: .8; }
  #speed { width: 150px; height: 28px; accent-color: #58b9c6; }
  #speedLabel { width: 4em; font-variant-numeric: tabular-nums; }
  #credit { position: fixed; left: 18px; right: 18px; bottom: calc(10px + env(safe-area-inset-bottom)); opacity: .4;
    font-size: 11px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="title"><b>Lacrymaria olor</b><span>drag to orbit · pinch or scroll to zoom · click the animal to orbit about that spot</span></div>
<div id="fps" hidden></div>
<label id="speedBox">Speed <input id="speed" type="range" min="0" max="6" step="1" aria-label="Simulation speed; all the way left pauses"><span id="speedLabel"></span></label>
<div id="credit">Cell measured from footage by James Weiss, Journey to the Microcosmos. Structure after Flaum &amp; Prakash, Science 2024. Behaviour and detail are modelled, not observed.</div>
<script>/*BUNDLE*/</script>
</body>
</html>
