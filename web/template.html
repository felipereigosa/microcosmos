<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lacrymaria olor</title>
<style>
  html, body { margin: 0; height: 100%; background: #01060b; overflow: hidden; color: #cfe9ee;
    font: 14px/1.3 system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #title { position: fixed; left: 18px; top: 14px; pointer-events: none; text-shadow: 0 0 8px #000; }
  #title b { font-size: 20px; font-style: italic; font-weight: 600; }
  #title span { display: block; opacity: .7; margin-top: 2px; }
  #fps { position: fixed; right: 14px; top: 14px; opacity: .6; font-variant-numeric: tabular-nums; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
    background: linear-gradient(transparent, rgba(0, 6, 10, .85)); }
  #play { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #3d7480; background: rgba(10, 40, 50, .6);
    color: #cfe9ee; font-size: 16px; }
  #seek { flex: 1 1 240px; }
  .speed { display: flex; align-items: center; gap: 8px; }
  #speed { width: 120px; }
  #speedLabel { width: 3.2em; font-variant-numeric: tabular-nums; }
  #info { flex-basis: 100%; opacity: .75; font-variant-numeric: tabular-nums; }
  #credit { flex-basis: 100%; opacity: .45; font-size: 11px; }
  input[type=range] { accent-color: #58b9c6; height: 28px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="title"><b>Lacrymaria olor</b><span>drag to orbit · pinch or scroll to zoom</span></div>
<div id="fps" hidden></div>
<div id="bar">
  <button id="play" aria-label="Play or pause">❚❚</button>
  <input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="Time">
  <label class="speed">Speed <input id="speed" type="range" min="0" max="6" step="1"><span id="speedLabel"></span></label>
  <div id="info"></div>
  <div id="credit">Motion tracked from footage by James Weiss, Journey to the Microcosmos. Structure after Flaum &amp; Prakash, Science 2024. Detail is modelled, not observed.</div>
</div>
<script>/*BUNDLE*/</script>
</body>
</html>
